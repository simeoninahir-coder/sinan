<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12364e">
<title>Sinan ERP</title>
<link rel="icon" href="../assets/isotipo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css?v=20261008c">
<!-- Modo claro u oscuro: se elige antes de dibujar para que no "parpadee" -->
<script>try { document.documentElement.dataset.tema = localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'); } catch (e) { document.documentElement.dataset.tema = 'claro'; }</script>
</head>
<body>

<!-- ============ PANTALLA DE LOGIN ============ -->
<section id="pantalla-login" hidden>
  <div class="login-caja">
    <img src="../assets/logo-vertical.png" alt="Sinan" class="login-logo">
    <h1>Panel de gestión</h1>
    <form autocomplete="on">
      <div class="campo">
        <label for="login-email" class="campo-etiqueta">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="campo">
        <label for="login-clave" class="campo-etiqueta">Contraseña</label>
        <div class="con-ojito">
          <input id="login-clave" name="clave" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          <button type="button" class="ojito" id="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">Ver</button>
        </div>
      </div>
      <p class="form-error" hidden></p>
      <button type="submit" class="boton boton-ancho">Entrar</button>
    </form>
  </div>
</section>

<!-- ============ APLICACIÓN ============ -->
<div id="app" hidden>
  <aside class="menu-lateral" aria-label="Menú principal">
    <div class="menu-marca">
      <img src="../assets/logo-horizontal.png" alt="Sinan" class="logo-claro">
      <img src="../assets/logo-horizontal-blanco.png" alt="Sinan" class="logo-oscuro">
    </div>
    <nav id="menu"></nav>
    <div class="menu-usuario">
      <span id="usuario-email"></span>
      <button type="button" id="boton-clave" class="boton-salir">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Cambiar contraseña
      </button>
      <button type="button" id="boton-salir" class="boton-salir">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>
  <div id="velo-menu"></div>

  <div class="principal">
    <header class="cabecera-movil">
      <button type="button" id="boton-menu" class="boton-icono" aria-label="Abrir menú">
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <img src="../assets/logo-horizontal.png" alt="Sinan" class="cabecera-logo logo-claro">
      <img src="../assets/logo-horizontal-blanco.png" alt="Sinan" class="cabecera-logo logo-oscuro">
    </header>
    <header class="barra-superior">
      <div class="bs-titulo"><h1 id="titulo-seccion"></h1><p id="desc-seccion"></p></div>
      <div class="bs-acciones">
        <span class="pill-fecha" id="pill-fecha"></span>
        <button type="button" class="interruptor-tema" id="boton-tema" aria-label="Cambiar entre modo claro y oscuro">
          <span class="t-claro"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
          <span class="t-oscuro"><svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></span>
        </button>
        <span class="avatar" id="avatar" aria-hidden="true"></span>
      </div>
    </header>
    <main id="contenido"></main>
  </div>
</div>

<!-- Conexión con Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261008c"></script>

<!-- Núcleo (piezas compartidas) -->
<script src="js/nucleo/utilidades.js?v=20261008c"></script>
<script src="js/nucleo/datos.js?v=20261008c"></script>
<script src="js/nucleo/interfaz.js?v=20261008c"></script>
<script src="js/nucleo/seccion-crud.js?v=20261008c"></script>
<script src="js/nucleo/negocio.js?v=20261008c"></script>
<script src="js/nucleo/app.js?v=20261008c"></script>

<!-- Secciones (el orden acá es el orden del menú) -->
<script src="js/secciones/inicio.js?v=20261008c"></script>
<!-- Ventas -->
<script src="js/secciones/ventas.js?v=20261008c"></script>
<script src="js/secciones/embudo.js?v=20261008c"></script>
<script src="js/secciones/clientes.js?v=20261008c"></script>
<!-- Logística -->
<script src="js/secciones/inventario.js?v=20261008c"></script>
<script src="js/secciones/envios.js?v=20261008c"></script>
<!-- Marketing -->
<script src="js/secciones/marketing.js?v=20261008c"></script>
<script src="js/secciones/eventos.js?v=20261008c"></script>
<!-- Administración -->
<script src="js/secciones/gastos-fijos.js?v=20261008c"></script>
<script src="js/secciones/finanzas.js?v=20261008c"></script>
<script src="js/secciones/proveedores.js?v=20261008c"></script>
<script src="js/secciones/equipo.js?v=20261008c"></script>
<script src="js/secciones/reportes.js?v=20261008c"></script>
<!-- Abajo del menú -->
<script src="js/secciones/alertas.js?v=20261008c"></script>
<script src="js/secciones/configuracion.js?v=20261008c"></script>
</body>
</html>
